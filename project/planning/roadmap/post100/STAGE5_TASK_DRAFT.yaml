tasks:
  - id: POST100-S5-001
    stage: 5
    title: Freeze Stage-5 normative prerequisites and accepted capability envelope
    objective: Convert accepted owner decisions, Stage-4 outputs, and approved spec deltas into a Stage-5 implementation baseline without editing semantics ad hoc during geometry work.
    depends_on: []
    plan_references:
      - docs/plan/05_LOW_LEVEL_GEOMETRY_TOPOLOGY_API.md
      - docs/plan/15_IMPLEMENTATION_ROADMAP.md#Stage-5
      - project/planning/post100/SPEC_DELTA_PROPOSALS.md
      - project/planning/post100/OPEN_DECISIONS.md#BEFORE-STAGE-5
    spec_dependencies:
      - D2 functional/value semantics
      - D6 kernel-neutral boundary
      - D7 Stage-4 semantic-reference policy
      - D18 runtime-backed standard-function policy
      - tolerance taxonomy owner ruling
      - raw/unsafe geometry owner ruling
      - kernel-backed source-query evaluation ruling
    acceptance:
      - Every Stage-5 source-visible capability maps to an approved semantic/spec section or is explicitly marked implementation-only.
      - No task relies on unresolved syntax, callable, collection, unsafe, query-evaluation, or tolerance behavior.
      - Safe/raw tiers and raw-to-safe promotion remain distinct architectural capabilities.
    required_checks:
      - review Stage-4 final gate packet and resolver semantics
      - review canonical language specs for completeness
      - cross-check RFC-0002/RFC-0003 and owner decisions for stale assumptions
    likely_crates: []
    escalate_if:
      - A required capability conflicts with a Stage-4 owner ruling.
      - A proposed operation would require a new compiler intrinsic rather than ordinary typed calls.
    gate_relevance: blocking architecture prerequisite

  - id: POST100-S5-002
    stage: 5
    title: Complete and validate the shared spatial-math semantic bridge
    objective: Ensure Point/Vector/Direction/Axis/Frame/Rotation/Transform semantics are unit-safe, validated, backend-neutral, and consistently convertible between source/HIR/runtime/kernel adapter layers.
    depends_on: [POST100-S5-001]
    plan_references:
      - docs/plan/03_TYPE_SYSTEM_UNITS_CONTROL_FLOW.md
      - docs/plan/05_LOW_LEVEL_GEOMETRY_TOPOLOGY_API.md
      - docs/plan/23_CROSS_SYSTEM_PARAMETER_CATALOG.md
    spec_dependencies:
      - AICAD-075A accepted output
      - SPEC-DELTA-011
    acceptance:
      - Direction/axis/frame invariants are source-semantic and not defined by OCCT or adapter-only thresholds.
      - Rigid transform composition, inverse, from/to frame, rotation and translation have deterministic tests.
      - Invalid zero directions and non-rigid frames fail with structured diagnostics/results at the correct layer.
      - No kernel adapter type leaks into the public language/HIR surface.
    required_checks:
      - cargo test for cad-hir cad-runtime cad-kernel-api
      - unit/dimensional type checks for spatial values
      - cross-layer conversion round trips
    likely_crates: [cad-hir, cad-types, cad-units, cad-runtime, cad-kernel-api, cad-geometry-api]
    escalate_if:
      - AICAD-075A leaves frame handedness/normalization/equality semantics unresolved.
      - Conversions require backend-specific public fields.
    gate_relevance: required foundation for curves surfaces and Stage-6 poses

  - id: POST100-S5-003
    stage: 5
    title: Implement typed tolerance-policy primitives for Stage-5 operations
    objective: Represent geometry-operation and approximation tolerance separately from solver, verification, representation-validity and D5 equivalence policies.
    depends_on: [POST100-S5-001, POST100-S5-002]
    plan_references:
      - docs/plan/05_LOW_LEVEL_GEOMETRY_TOPOLOGY_API.md
      - docs/plan/23_CROSS_SYSTEM_PARAMETER_CATALOG.md
      - project/planning/post100/SPEC_DELTA_PROPOSALS.md#SPEC-DELTA-010
    spec_dependencies:
      - tolerance taxonomy owner ruling
      - D19 D5 profile remains separate
    acceptance:
      - Operation and approximation tolerances have typed units/scopes and versioned/default provenance.
      - Effective tolerance is recordable in structured operation evidence.
      - No Stage-5 API implicitly reuses cad-validation D5 constants or sketch-solver convergence tolerance.
      - Explicit low-level overrides are validated and cannot silently change unrelated tolerance classes.
    required_checks:
      - dimensional tests
      - serialization/evidence determinism tests for policy values
      - grep/review for D5 or sketch-solver constants reused by new geometry operations
    likely_crates: [cad-types, cad-geometry-api, cad-kernel-api, cad-validation]
    escalate_if:
      - A kernel operation cannot expose/accept the policy needed to implement the normative semantics.
    gate_relevance: required numerical foundation

  - id: POST100-S5-004
    stage: 5
    title: Scale trusted runtime standard functions and kernel-backed query evaluation
    objective: Implement the accepted D18 scaling design and explicit evaluation model for source-visible kernel queries without adding geometry-specific language magic.
    depends_on: [POST100-S5-001, POST100-S5-003]
    plan_references:
      - docs/API/safe-cad-api.md
      - docs/plan/02_LANGUAGE_AND_COMPILER.md
      - docs/plan/05_LOW_LEVEL_GEOMETRY_TOPOLOGY_API.md
    spec_dependencies:
      - OD-S5-02 ruling
      - OD-S5-04 ruling
      - D9 intrinsic gate
      - D18 runtime-backed standard functions
    acceptance:
      - Runtime-backed advanced functions use ordinary lexical binding/call/type-checking semantics.
      - Trusted native implementation identities/signatures are declared once and consumed by checker/runtime/docs generation or equivalent single source of truth.
      - Kernel-backed query values can participate in approved source evaluation deterministically with cache/dependency/resource accounting.
      - Packages/plugins still cannot register arbitrary native callbacks unless separately authorized.
    required_checks:
      - catalogue consistency tests
      - source-defined function and runtime-backed function call-equivalence tests
      - deterministic query memoization/dependency invalidation tests
      - resource-budget tests
    likely_crates: [cad-hir, cad-runtime, cad-compiler, cad-geometry-runtime, cad-diagnostics]
    escalate_if:
      - Query evaluation would introduce uncontrolled I/O or nondeterministic effects.
      - A new syntax/type-checking rule is proposed solely to call geometry runtime code.
    gate_relevance: prevents Stage-5 compiler/API dead end

  - id: POST100-S5-005
    stage: 5
    title: Extend feature DAG and provenance through programmable geometry
    objective: Preserve feature identity dependencies cache invalidation and source provenance when geometry is created inside ordinary functions parts and approved control flow.
    depends_on: [POST100-S5-001, POST100-S5-004]
    plan_references:
      - docs/plan/06_REFERENCES_QUERIES_FEATURE_DAG.md
      - docs/plan/14_COLLABORATION_PROVENANCE_SECURITY.md
      - project/planning/post100/ARCHITECTURE_GAP_REGISTER.md#GAP-003
    spec_dependencies:
      - OD-S5-06 ruling
      - Stage-4 semantic-reference identity model
    acceptance:
      - Geometry-producing user functions are visible in semantic feature/dependency provenance according to approved identity semantics.
      - Repeated calls and branch-dependent geometry have deterministic identities or explicit unsupported/error behavior defined by spec.
      - Part bodies no longer create an observability hole for features required by references/incremental rebuild.
      - Existing Stage3 cache-key and dirty-propagation determinism is preserved.
    required_checks:
      - helper-function geometry fixture
      - nested-part geometry fixture
      - branch/repeated-call identity fixture
      - incremental invalidation and source-to-feature navigation tests
    likely_crates: [cad-feature-graph, cad-hir, cad-runtime, cad-compiler, cad-provenance]
    escalate_if:
      - Stable semantic feature identity cannot be defined for a supported language construct.
    gate_relevance: architectural prerequisite for programmable advanced geometry

