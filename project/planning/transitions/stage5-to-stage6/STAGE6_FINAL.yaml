common_required_checks:
  - cargo fmt --all -- --check
  - cargo clippy --workspace --all-targets --all-features -- -D warnings
  - cargo test --workspace
common_escalation:
  - a public semantic decision is required beyond resolved owner decisions
  - any D26 identity domain would have to collapse into another identity domain
  - solver/native/kernel identity would become public assembly semantics
  - deterministic pose/DOF policy is insufficient to define observable behavior
  - configuration semantics would destructively erase identity or provenance
  - external assets would require filesystem-path, importer-index, or kernel identity
  - cross-instance semantic references cannot preserve Stage-4/5 fail-closed durability
  - a required Stage-5 capability proves to be test/mock-only
  - a gate or invariant would need weakening
