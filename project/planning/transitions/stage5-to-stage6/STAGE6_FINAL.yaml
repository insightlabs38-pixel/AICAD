tasks:
- id: AICAD-131
  stage: 6
  batch: S6-00
  title: Stabilize Stage-5 compatibility and close prerequisite geometry/dependency gaps
  depends_on: []
  objective: Freeze the Stage-5 spatial, query, reference, lineage, exact-geometry, and incremental-regeneration contracts Stage 6 relies on, and close the two known Stage-5 prerequisite gaps before assembly implementation begins, without reopening D26-D30.
  acceptance:
    - Compatibility fixtures cover nested source identity, stable semantic references, pose-safe geometry subjects, lineage/adoption evidence, exact-geometry behavior, and incremental regeneration before Stage-6 assembly semantics are layered on top.
    - Bezier/B-spline curves and surfaces, plus trimmed surfaces, can be converted into real kernel topology through `make_edge` / `make_face_on_surface` for supported mathematically/topologically valid inputs; supported cases no longer return `UNSUPPORTED_TOPOLOGY_CONSTRUCTION`, while invalid inputs fail deterministically with structured diagnostics.
    - `List<Geometry>` builtin parameters participate in `geometry_inputs` for both `FeatureGraph` and `TraceFeatureGraph`, and generic-list geometry dependencies drive correct dirty-set / incremental invalidation rather than remaining invisible.
    - Focused regression fixtures prove the new freeform-to-topology and `List<Geometry>` dependency behavior without weakening existing Stage-4/5 fail-closed semantic-reference, lineage, exactness, or determinism guarantees.
    - AICAD-132 and later Stage-6 work may rely on these two repaired prerequisite paths only after the AICAD-131 evidence and required tests pass.
  required_tests: [focused Stage-5 compatibility fixtures, freeform-to-kernel-topology construction and invalid-input diagnostics, List<Geometry> geometry_inputs and dirty-set invalidation fixtures for FeatureGraph and TraceFeatureGraph, existing semantic-reference harness, existing active example suite]
  evidence: project/reports/AICAD-131.md
  owner_escalation: [actual Stage-5 behavior contradicts D26-D30 or prevents cross-instance semantic references, either prerequisite fix requires new public semantics beyond approved Stage-5 contracts, either fix cannot be completed without weakening an existing invariant or gate]

- id: AICAD-132
  stage: 6
  batch: S6-01
  title: Implement general interfaces/protocols and bounded generics
  depends_on: [AICAD-131]
  objective: Provide the D27 language machinery used by assemblies without assembly-only compiler magic.
  acceptance: [interfaces/conformance and bounded generics are ordinary typed language mechanisms, mechanical-interface use requires no named compiler special case, diagnostics are deterministic and source-traceable]
  required_tests: [positive and negative conformance fixtures, bounded-generic type tests, deterministic diagnostics]
  evidence: project/reports/AICAD-132.md
  owner_escalation: [D27 cannot express required mechanical-interface conformance without new public semantics]

- id: AICAD-133
  stage: 6
  batch: S6-01
  title: Implement assembly semantic identity primitives
  depends_on: [AICAD-131]
  objective: Establish the distinct D26 assembly identity domains before assembly realization exists.
  acceptance: [definition identity logical-instance identity nested-occurrence/path identity configuration-slot identity external-asset identity semantic-topology identity and BOM identity remain distinct, identities are deterministic reproducible and type-safe, no identity derives from topology indices solver variables filesystem paths or BOM rows]
  required_tests: [identity-domain type tests, deterministic serialization/rebuild tests, collision/adversarial fixtures]
  evidence: project/reports/AICAD-133.md
  owner_escalation: [any required identity domain would have to collapse or alias another D26 domain]

- id: AICAD-134
  stage: 6
  batch: S6-02
  title: Implement component-definition and logical-instance semantic IR
  depends_on: [AICAD-132, AICAD-133]
