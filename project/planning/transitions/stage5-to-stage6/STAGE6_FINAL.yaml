  acceptance: [definitions and instances are distinct semantic entities, shared definitions stay shared under reuse and parameterization, realized geometry occurrence is never authoritative assembly identity]
  required_tests: [definition reuse fixtures, repeated-instance identity tests, parameterized definition rebuild tests]
  evidence: project/reports/AICAD-134.md
  owner_escalation: [ordinary language abstraction would erase feature identity dependencies provenance incremental behavior or reference support]

