name: AICAD-079C task metadata one-shot

on:
  push:
    branches:
      - claude/aicad-stage4-transition
    paths:
      - 'scripts/ci/stage4_task_audit.py'
      - '.github/workflows/aicad079c-task-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply narrow Stage-4 task metadata corrections
        run: python scripts/ci/stage4_task_audit.py --fix
      - name: Commit task metadata when changed
        shell: bash
        run: |
          set -eu
          if git diff --quiet -- project/TASKS.yaml; then
            echo 'project/TASKS.yaml already up to date'
            exit 0
          fi
          git diff --check
          git config user.name 'insightlabs38-pixel'
          git config user.email 'insightlabs38@gmail.com'
          git add project/TASKS.yaml
          git commit -m 'tasks: add AICAD-079C Stage-4 CI transition task'
          git push origin HEAD:claude/aicad-stage4-transition
