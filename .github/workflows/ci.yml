name: CI

# Baseline Stage-0 CI (AICAD-004): fmt, clippy, build/test, and a native
# build smoke check. The native-build-smoke job builds and runs
# native/occt_bridge's CMake project against a system-installed OCCT
# (Stage 1, AICAD-015 onward); if native/occt_bridge ever has no
# CMakeLists.txt again it reports "nothing to build yet" rather than
# failing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to avoid wasted CI time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact channel; rustup on the runner
      # auto-installs it on first cargo/rustup invocation.
      - name: Show toolchain
        run: rustup show
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  build-and-test:
    name: cargo build/test --workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustup show
      - name: cargo build --workspace
        run: cargo build --workspace --all-targets
      - name: cargo test --workspace
        run: cargo test --workspace

  native-build-smoke:
    name: native bridge build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT development packages
        # Module set matches native/occt_bridge/CMakeLists.txt's
        # OCCT_PROBE_LIBS (FoundationClasses, ModelingData,
        # ModelingAlgorithms only, as of AICAD-015). Extend this list only
        # alongside a corresponding CMakeLists.txt module addition.
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libocct-foundation-dev \
            libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev
      - name: cmake --version
        run: cmake --version
      - name: Native bridge smoke build
        # Report status explicitly rather than silently passing or
        # failing if native/occt_bridge ever loses its CMakeLists.txt
        # again, instead of assuming it is always present.
        run: |
          set -eu
          found=$(find native -mindepth 1 -iname 'CMakeLists.txt' 2>/dev/null | head -n1 || true)
          if [ -z "$found" ]; then
            echo "No native/**/CMakeLists.txt present (unexpected as of Stage 1, AICAD-015). Smoke check is a no-op."
            exit 0
          fi
          dir=$(dirname "$found")
          echo "Found $found — configuring and building $dir"
          cmake -S "$dir" -B "$dir/build"
          cmake --build "$dir/build"
      - name: Native bridge probe test (ctest)
        run: |
          set -eu
          cd native/occt_bridge/build
          ctest --output-on-failure
