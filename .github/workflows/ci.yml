name: CI

on:
  push:
    branches:
      - main
      - claude/aicad-stage4-transition
      - claude/aicad-stage4-dev
      - claude/aicad-stage5-transition
      - claude/aicad-stage6-transition
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  fmt:
    name: fmt and repository metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show toolchain
        run: rustup show
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
      - name: Validate CI helper syntax
        run: python -m py_compile scripts/ci/*.py
      - name: Audit Stage-4 task transition metadata
        run: python scripts/ci/stage4_task_audit.py --check
      - name: AICAD-079C transition diff whitespace check
        if: github.ref_name == 'claude/aicad-stage4-transition'
        run: git diff --check 9e2db88cbbfe9097364fcbfc3ab8115b07b63efd HEAD
      - name: Stage-5 to Stage-6 transition diff whitespace check
        if: github.ref_name == 'claude/aicad-stage6-transition'
        run: git diff --check 697847cb2f33f6ab75bdc71911bbbcdd993039ba HEAD

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-occt-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'native/occt_bridge/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-clippy-
            ${{ runner.os }}-
      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  workspace:
    name: workspace build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-occt-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-workspace-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'native/occt_bridge/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-workspace-
            ${{ runner.os }}-
      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets --locked
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  native:
    name: native OCCT bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-occt-dev
      - name: Configure native bridge
        run: cmake -S native/occt_bridge -B native/occt_bridge/build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build native bridge
        run: cmake --build native/occt_bridge/build --parallel 2
      - name: Run native bridge tests
        run: ctest --test-dir native/occt_bridge/build --output-on-failure

  smoke:
    name: compiler/runtime/exact-geometry smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-occt-dev
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-smoke-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'native/occt_bridge/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-smoke-
            ${{ runner.os }}-
      - name: Stage-2 source-to-kernel smoke
        run: cargo test -p cad-cli --test stage2_end_to_end --locked -- --test-threads=1
      - name: Stage-3 incremental-build smoke
        run: cargo test -p cad-cli --test stage3_parametric_incremental_rebuild --locked -- --test-threads=1
      - name: Frozen Stage-4 corpus buildability smoke
        run: cargo test -p cad-cli --test stage4_reference_benchmark_fixtures --locked -- --test-threads=1
      - name: Maintained ACTIVE examples
        run: cargo test -p cad-cli --test active_examples --locked -- --test-threads=1
