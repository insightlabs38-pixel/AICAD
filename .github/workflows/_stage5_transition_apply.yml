name: Apply final Stage-5 transition metadata

on:
  push:
    branches:
      - claude/aicad-stage5-transition
    paths:
      - .github/workflows/_stage5_transition_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/aicad-stage5-transition
          fetch-depth: 0

      - name: Apply and validate planning-only changes
        run: |
          sed -i 's/r"^- id: (S6-/r"^  - id: (S6-/' project/planning/transitions/stage4-to-stage5/.apply_transition.py
          sed -i 's/r"^- id: (S7-/r"^  - id: (S7-/' project/planning/transitions/stage4-to-stage5/.apply_transition.py
          python3 project/planning/transitions/stage4-to-stage5/.apply_transition.py
          python3 scripts/ci/stage4_task_audit.py --check
          git diff --check

      - name: Commit and push
        run: |
          git config user.name "insightlabs38-pixel"
          git config user.email "insightlabs38@gmail.com"
          rm .github/workflows/_stage5_transition_apply.yml
          rm project/planning/transitions/stage4-to-stage5/.apply_transition.py
          git add -A -- .github/workflows/_stage5_transition_apply.yml project/planning/transitions/stage4-to-stage5/.apply_transition.py project/TASKS.yaml project/DECISION_LOG.md project/planning/transitions/stage4-to-stage5/TRANSITION_REPORT.md
          git diff --cached --check
          git commit -m "Stage5 transition: finalize executable roadmap queue"
          git push origin HEAD:claude/aicad-stage5-transition
