name: Final Stage 6 approval metadata sync
on: [push]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/aicad-stage6-transition
          fetch-depth: 0
      - name: Sync metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          reps = {
            "README.md": [
              ("This transition branch is still pending final owner approval/merge, so no Stage-6 product capability is claimed as implemented yet.", "The Stage-6 execution queue is owner-approved and implementation is authorized, but no Stage-6 product capability is claimed as implemented until its corresponding task evidence passes."),
            ],
            "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml": [
              ("status: FINAL_PENDING_TRANSITION_MERGE", "status: FINAL_OWNER_APPROVED_ACTIVE"),
              ("execution_rule: Executable only after the owner merges the Stage-5 -> Stage-6 transition. Stage 7 remains provisional.", "execution_rule: Owner-approved for execution after this transition is canonical on main; begin with AICAD-131 on the Stage-6 development branch. Stage 7 remains provisional/non-executable."),
            ],
            "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md": [
              ("- **Status:** FINALIZED — executable only after owner merge of the Stage-5 -> Stage-6 transition", "- **Status:** OWNER APPROVED / ACTIVE — Stage 6 is in progress; execute from the exact approved transition merge on `main`"),
            ],
            "project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md": [
              ("- Owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.", "- Stage-5 owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n- Stage-6 queue/implementation approval: APPROVED and durably recorded in `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-39`."),
              ("None discovered that blocks the first Stage-6 task. D26-D30 remain resolved and authoritative.", "None blocks Stage-6 entry. The owner has approved the final Stage-6 queue and authorized implementation; D26-D30 remain resolved and authoritative."),
            ],
          }
          for fn, pairs in reps.items():
              p = Path(fn); s = p.read_text()
              for old, new in pairs:
                  if old not in s: raise SystemExit(f"missing expected text in {fn}: {old[:80]}")
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          if ! grep -q '^## DL-39:' project/DECISION_LOG.md; then
          cat >> project/DECISION_LOG.md <<'EOF'

---

## DL-39: Stage-6 queue approved — implementation authorized

- Date: 2026-09-22
- Resolves: the Stage-6 implementation-authorization boundary left open by `DL-38` after Stage-5 passage and the Stage-5 -> Stage-6 transition review.
- Decision: **the final Stage-6 queue is approved and Stage 6 is in progress.** The owner reviewed `AICAD-131..AICAD-160`, fixed batches `S6-00..S6-12`, checkpoints AICAD-141/AICAD-148/AICAD-156, the AICAD-160 final hard gate, and the transition report, and explicitly authorizes merge of `claude/aicad-stage6-transition` plus Stage-6 implementation from that exact merged `main` HEAD. The durable approval record is `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md`.
- AICAD-131 scope: this approval includes the owner's explicit decision to fix both Stage-5 prerequisite gaps in AICAD-131: supported Bezier/B-spline/trimmed geometry to real kernel topology construction and first-class `List<Geometry>` geometry dependency/dirty-set invalidation in `FeatureGraph` and `TraceFeatureGraph`. AICAD-132/133 remain blocked until AICAD-131 passes.
- Rationale: closing the two known prerequisite gaps at AICAD-131 prevents later assembly work from accumulating on an intentionally incomplete Stage-5 substrate while Stage 6 adds assembly identity, references, interfaces, solver-neutral mates/joints, deterministic pose/DOF behavior, configurations, assets, BOM/interference, and validation/tooling.
- Consequences: Stage 6 is the active development stage. Create `claude/aicad-stage6-dev` from the exact transition merge commit and execute the final queue one bounded task at a time beginning with AICAD-131. D25-D30 and D11 remain authoritative and unchanged. Stage 7 remains provisional and non-executable.
- Affected tasks: unblocks AICAD-131..AICAD-160 subject to their declared dependencies and checkpoints; does not mark any Stage-6 implementation task complete.
- Supersedes: the `DL-38` restriction that Stage-6 implementation remained unauthorized until separate owner review/merge of the transition; it does not supersede any D-numbered semantic decision.
EOF
          fi
          git diff --check
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/stage6-approval-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md project/DECISION_LOG.md project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md .github/workflows/stage6-approval-final.yml
          git commit -m "governance: finalize Stage 6 owner approval metadata"
          git push origin HEAD:claude/aicad-stage6-transition
