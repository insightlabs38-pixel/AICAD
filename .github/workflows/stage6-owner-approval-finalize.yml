name: Finalize Stage 6 owner approval

on:
  push:
    branches:
      - claude/aicad-stage6-transition

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/aicad-stage6-transition
          fetch-depth: 0

      - name: Record owner approval and activate Stage 6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {n}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # README: Stage 6 is owner-approved and active, without claiming unfinished capability.
          replace_once(
              "README.md",
              "> **Status:** Stage 5 is complete, owner-approved, and merged. **Stage 6 is now the active, in-progress development stage**: the assembly/configuration execution queue is finalized, with AICAD-131 as the first compatibility-and-remediation task. This transition branch is still pending final owner approval/merge, so no Stage-6 product capability is claimed as implemented yet. AICAD is pre-1.0 and its language/API surface is still evolving.",
              "> **Status:** Stage 5 is complete, owner-approved, and merged. **Stage 6 is the active, in-progress development stage and its execution queue is owner-approved**, with AICAD-131 as the first compatibility-and-remediation task. Stage-6 implementation is authorized, but no Stage-6 product capability is claimed as implemented until its corresponding task evidence passes. AICAD is pre-1.0 and its language/API surface is still evolving.",
          )

          # Current stage: authorization is now explicit and durable.
          current = "project/CURRENT_STAGE.md"
          replace_once(
              current,
              "- **Stage-5 -> Stage-6 transition:** COMPLETE on `claude/aicad-stage6-transition`, pending owner review/merge.\n- **Stage 6 — Assemblies, configurations, and kinematics:** FINAL QUEUE PREPARED, **NOT YET AUTHORIZED FOR IMPLEMENTATION** until this transition is owner-merged.",
              "- **Stage-5 -> Stage-6 transition:** COMPLETE and OWNER APPROVED; approval is recorded in `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-39`.\n- **Stage 6 — Assemblies, configurations, and kinematics:** **ACTIVE / IN PROGRESS; IMPLEMENTATION AUTHORIZED.** AICAD-131 is the first executable task after the approved transition is canonical on `main`.",
          )
          replace_once(
              current,
              "## Execution boundary\n\nDo **not** execute AICAD-131 or create the Stage-6 development branch while this transition branch is awaiting owner merge.\n\nAfter the owner merges this transition to `main`, create `claude/aicad-stage6-dev` from that exact merged `main` HEAD and begin AICAD-131.\n\nDo not implement Stage 7.",
              "## Execution boundary\n\nStage-6 implementation is owner-authorized by `DL-39`. Canonical implementation must occur on `claude/aicad-stage6-dev` created from the exact owner-approved Stage-5 -> Stage-6 transition merge commit on `main`; begin with AICAD-131 and execute the fixed queue in order.\n\nDo not implement Stage 7.",
          )

          # Session handoff.
          handoff = "project/SESSION_HANDOFF.md"
          replace_once(
              handoff,
              "The Stage-5 -> Stage-6 transition has finalized the Stage-6 queue but does not authorize or implement Stage 6. The transition branch is `claude/aicad-stage6-transition` and must be owner-reviewed/merged before Stage-6 development begins.\n\n## Next executable stage\n\nAfter owner merge of this transition:\n\n1. create `claude/aicad-stage6-dev` from the exact merged `main` HEAD;\n2. execute AICAD-131;\n3. proceed one bounded task at a time through AICAD-160 and fixed batches S6-00..S6-12;\n4. stop at the Stage-6 owner hard gate before any Stage-7 promotion or implementation.",
              "The Stage-5 -> Stage-6 transition and final Stage-6 queue are owner-approved. Stage 6 is now the active, in-progress stage and implementation is authorized by `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md` / `project/DECISION_LOG.md#DL-39`. No Stage-6 implementation task is marked complete by this approval.\n\n## Next executable work\n\n1. use `claude/aicad-stage6-dev` created from the exact owner-approved transition merge commit on `main`;\n2. execute AICAD-131 first;\n3. proceed one bounded task at a time through AICAD-160 and fixed batches S6-00..S6-12;\n4. stop at the Stage-6 owner hard gate before any Stage-7 promotion or implementation.",
          )

          # Final queue status.
          final_yaml = "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml"
          replace_once(final_yaml, "status: FINAL_PENDING_TRANSITION_MERGE", "status: FINAL_OWNER_APPROVED_ACTIVE")
          replace_once(
              final_yaml,
              "execution_rule: Executable only after the owner merges the Stage-5 -> Stage-6 transition. Stage 7 remains provisional.",
              "execution_rule: Owner-approved for execution after this transition is canonical on main; begin with AICAD-131 on the Stage-6 development branch. Stage 7 remains provisional/non-executable.",
          )

          # Batch plan status.
          batches = "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md"
          replace_once(
              batches,
              "- **Status:** FINALIZED — executable only after owner merge of the Stage-5 -> Stage-6 transition",
              "- **Status:** OWNER APPROVED / ACTIVE — Stage 6 is in progress; execute from the exact approved transition merge on `main`",
          )

          # Transition report: approval and final action state.
          report = "project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md"
          replace_once(
              report,
              "- Owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n- Transition branch: `claude/aicad-stage6-transition`, created from the exact merged Stage-5 `main` HEAD.",
              "- Stage-5 owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n- Stage-6 queue/implementation approval: APPROVED and durably recorded in `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-39`.\n- Transition branch: `claude/aicad-stage6-transition`, created from the exact merged Stage-5 `main` HEAD and approved for merge to `main`.",
          )
          replace_once(
              report,
              "## 9. Unresolved owner decisions\n\nNone discovered that blocks the first Stage-6 task. D26-D30 remain resolved and authoritative.\n\nAny new public semantic choice discovered during execution must be escalated rather than inferred.",
              "## 9. Unresolved owner decisions\n\nNone blocks Stage-6 entry. The owner has approved the final Stage-6 queue and authorized implementation; D26-D30 remain resolved and authoritative.\n\nAny new public semantic choice discovered during execution must be escalated rather than inferred.",
          )
          replace_once(
              report,
              "## 11. Exact next action\n\n1. Owner reviews this transition branch.\n2. Owner merges `claude/aicad-stage6-transition` to `main` if accepted.\n3. Only after that merge, create `claude/aicad-stage6-dev` from the exact approved merged `main` HEAD.\n4. Execute AICAD-131 first. Do not begin Stage 7.",
              "## 11. Exact next action\n\n1. Merge the owner-approved `claude/aicad-stage6-transition` branch to `main`.\n2. Create `claude/aicad-stage6-dev` from that exact merged `main` HEAD.\n3. Execute AICAD-131 first, including both prerequisite repairs and compatibility evidence.\n4. Continue the fixed Stage-6 queue in order. Do not begin Stage 7.",
          )

          # Durable queue/implementation approval artifact.
          approval = Path("project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md")
          if approval.exists():
              raise SystemExit("Stage 6 approval artifact already exists")
          approval.write_text("""# Stage 6 queue owner approval

Date: 2026-09-22

The owner has reviewed the finalized Stage-5 -> Stage-6 transition state on
`claude/aicad-stage6-transition`, including:

- the final executable Stage-6 queue, `AICAD-131` through `AICAD-160`, in
  `project/TASKS.yaml` and `project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml`;
- the fixed `S6-00` through `S6-12` execution batches and checkpoints in
  `project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md`;
- the transition/evidence reconciliation in
  `project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md`;
- the explicit AICAD-131 remediation of the Stage-5 freeform/trimmed-to-kernel-topology
  construction gap and the `List<Geometry>` dependency/invalidation gap;
- Stage 7 remaining provisional and non-executable.

The owner explicitly approves this transition queue, authorizes its merge to
`main`, and authorizes Stage-6 implementation to begin from the exact merged
transition HEAD. Stage 6 is therefore the active, in-progress development
stage.

This approval preserves D25-D30 and D11 and does not amend or reopen any
resolved semantic decision. In particular, assembly identity domains remain
distinct, mechanical interfaces use general interface/protocol semantics,
mate/joint meaning remains AICAD-owned and solver-neutral, configuration
state remains immutable/identity-preserving, and external-asset identity
remains content/provenance based.

Per this approval:

- `claude/aicad-stage6-transition` is approved for merge to `main`;
- `claude/aicad-stage6-dev` must be created from that exact merged `main`
  HEAD before implementation work;
- Stage-6 implementation begins with AICAD-131 (batch `S6-00`), including
  both prerequisite fixes required by its acceptance criteria;
- AICAD-132/133 remain blocked until AICAD-131 evidence passes;
- Stage 7 remains provisional and non-executable until a future separate
  owner gate.

The implementing agent does not approve stage progression; this file records
the owner's explicit approval.
""")

          # Durable decision-log authorization.
          dlog = Path("project/DECISION_LOG.md")
          text = dlog.read_text()
          if "## DL-39:" in text:
              raise SystemExit("DL-39 already exists")
          entry = """

---

## DL-39: Stage-6 queue approved — implementation authorized

- Date: 2026-09-22
- Resolves: the Stage-6 implementation-authorization boundary left open by
  `DL-38` after Stage-5 passage and the Stage-5 -> Stage-6 transition review.
- Decision: **the final Stage-6 queue is approved and Stage 6 is in progress.**
  The owner reviewed `AICAD-131..AICAD-160`, fixed batches `S6-00..S6-12`,
  checkpoints AICAD-141/AICAD-148/AICAD-156, the AICAD-160 final hard gate,
  and the transition report, and explicitly authorizes merge of
  `claude/aicad-stage6-transition` plus Stage-6 implementation from that exact
  merged `main` HEAD. The durable approval record is
  `project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md`.
- AICAD-131 scope: this approval includes the owner's explicit decision to
  fix, rather than merely carry forward, both Stage-5 prerequisite gaps in
  AICAD-131: supported Bezier/B-spline/trimmed geometry -> real kernel topology
  construction and first-class `List<Geometry>` geometry dependency/dirty-set
  invalidation in `FeatureGraph` and `TraceFeatureGraph`. AICAD-132/133 remain
  blocked until those fixes and the rest of AICAD-131's compatibility evidence
  pass.
- Rationale: Stage 6 builds assembly identity, semantic references, mechanical
  interfaces, solver-neutral mates/joints, deterministic pose/DOF behavior,
  immutable configurations, external assets, BOM/interference, and final
  adversarial/tooling evidence. Closing the two known prerequisite gaps at
  AICAD-131 prevents later assembly work from accumulating on an intentionally
  incomplete Stage-5 substrate.
- Consequences: Stage 6 is the active development stage. Create
  `claude/aicad-stage6-dev` from the exact transition merge commit and execute
  the final queue one bounded task at a time beginning with AICAD-131. D25-D30
  and D11 remain authoritative and unchanged. Stage 7 remains provisional and
  non-executable.
- Affected tasks: unblocks AICAD-131..AICAD-160 subject to their declared
  dependencies and checkpoints; does not mark any Stage-6 implementation task
  complete.
- Supersedes: the `DL-38` restriction that Stage-6 implementation remained
  unauthorized until separate owner review/merge of the transition; it does
  not supersede any D-numbered semantic decision.
"""
          dlog.write_text(text.rstrip() + entry + "\n")
          PY

          git diff --check
          grep -q '## DL-39: Stage-6 queue approved' project/DECISION_LOG.md
          grep -q 'FINAL_OWNER_APPROVED_ACTIVE' project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml
          grep -q 'ACTIVE / IN PROGRESS; IMPLEMENTATION AUTHORIZED' project/CURRENT_STAGE.md
          test -f project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md

      - name: Commit approval state and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/stage6-owner-approval-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md project/CURRENT_STAGE.md project/SESSION_HANDOFF.md project/DECISION_LOG.md project/approvals/STAGE6_QUEUE_OWNER_APPROVAL.md project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md .github/workflows/stage6-owner-approval-finalize.yml
          git commit -m "governance: approve Stage 6 queue and authorize implementation"
          git push origin HEAD:claude/aicad-stage6-transition
