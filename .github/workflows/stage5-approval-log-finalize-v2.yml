name: Finalize Stage 5 owner approval logging v2

on:
  push:
    branches:
      - claude/aicad-stage6-transition

permissions:
  contents: write

jobs:
  finalize:
    name: record Stage 5 approval and clean temporary workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Record owner approval
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; import base64; p=Path("project/DECISION_LOG.md"); s=p.read_text(encoding="utf-8"); m="## DL-38: Stage 5 passed — owner approval of the AICAD-130 PASS gate"; e=""; p.write_text(s if m in s else s.rstrip()+base64.b64decode(e).decode("utf-8").rstrip("\n")+"\n", encoding="utf-8")'
          python3 -c 'from pathlib import Path; p=Path("project/approvals/STAGE5_OWNER_APPROVAL.md"); s=p.read_text(); p.write_text(s if "DECISION_LOG.md#DL-38" in s else s.replace("- **Owner:** insightlabs38-pixel\n", "- **Owner:** insightlabs38-pixel\n- **Decision-log record:** `project/DECISION_LOG.md#DL-38`\n"))'
          python3 -c 'from pathlib import Path; p=Path("project/CURRENT_STAGE.md"); s=p.read_text(); p.write_text(s.replace("- **Final Stage-5 gate:** PASS recommended; owner approval is recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md`.\n", "- **Final Stage-5 gate:** PASS recommended; owner approval is recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n"))'
          python3 -c 'from pathlib import Path; p=Path("project/SESSION_HANDOFF.md"); s=p.read_text(); n="Stage 5 is complete, owner-approved, and merged to `main` at `697847cb2f33f6ab75bdc71911bbbcdd993039ba`. AICAD-130 is the final Stage-5 task and its gate recommends PASS.\n"; p.write_text(s if "project/DECISION_LOG.md#DL-38" in s else s.replace(n, n.rstrip("\n")+" Owner approval is durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n"))'
          python3 -c 'from pathlib import Path; p=Path("project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md"); s=p.read_text(); p.write_text(s.replace("- Owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md`.\n", "- Owner approval: APPROVED and durably recorded in `project/approvals/STAGE5_OWNER_APPROVAL.md` and `project/DECISION_LOG.md#DL-38`.\n"))'
          grep -q '^## DL-38: Stage 5 passed' project/DECISION_LOG.md
          grep -q 'DECISION_LOG.md#DL-38' project/approvals/STAGE5_OWNER_APPROVAL.md
          grep -q 'DECISION_LOG.md#DL-38' project/CURRENT_STAGE.md
          grep -q 'DECISION_LOG.md#DL-38' project/SESSION_HANDOFF.md
          grep -q 'DECISION_LOG.md#DL-38' project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md
          python3 scripts/ci/stage4_task_audit.py --check
          git diff --check
      - name: Commit approval record and remove temporary workflows
        shell: bash
        run: |
          git config user.name "insightlabs38-pixel"
          git config user.email "insightlabs38@gmail.com"
          git rm .github/workflows/stage5-approval-log-finalize.yml .github/workflows/stage5-approval-log-finalize-v2.yml
          git add project/DECISION_LOG.md project/approvals/STAGE5_OWNER_APPROVAL.md project/CURRENT_STAGE.md project/SESSION_HANDOFF.md project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md
          git commit -m "planning: record Stage 5 owner approval"
          git push origin HEAD:claude/aicad-stage6-transition
