name: AICAD-131 remediation planning update

on:
  push:
    branches:
      - claude/aicad-stage6-transition
    paths:
      - .github/workflows/aicad131-remediation-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/aicad-stage6-transition
          fetch-depth: 0
      - name: Update AICAD-131 scope consistently
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count} for: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          final_yaml = "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml"
          tasks_yaml = "project/TASKS.yaml"

          for path in (final_yaml, tasks_yaml):
              replace_once(
                  path,
                  "title: Codify Stage-6 compatibility fixtures from final Stage-5 evidence",
                  "title: Stabilize Stage-5 compatibility and close prerequisite geometry/dependency gaps",
              )
              replace_once(
                  path,
                  "objective: Freeze the Stage-5 spatial, query, reference, lineage, exact-geometry, and incremental-regeneration contracts Stage 6 relies on without reopening D26-D30.",
                  "objective: Freeze the Stage-5 spatial, query, reference, lineage, exact-geometry, and incremental-regeneration contracts Stage 6 relies on, and close the two known Stage-5 prerequisite gaps before assembly implementation begins, without reopening D26-D30.",
              )
              replace_once(
                  path,
                  """  acceptance:\n    - Compatibility fixtures cover nested source identity, stable semantic references, pose-safe geometry subjects, lineage/adoption evidence, the explicit freeform-to-topology unsupported boundary, and the `List<Geometry>` dependency-tracking gap.\n    - Stage 6 does not depend on unsupported conversion of Bezier/B-spline curves/surfaces or trimmed surfaces into kernel topology; any such need must be surfaced as an explicit dependency rather than assumed.\n    - Any assembly dependency path introduced later must be first-class and observable rather than relying on the unverified generic List<Geometry> invalidation path.\n""",
                  """  acceptance:\n    - Compatibility fixtures cover nested source identity, stable semantic references, pose-safe geometry subjects, lineage/adoption evidence, exact-geometry behavior, and incremental regeneration before Stage-6 assembly semantics are layered on top.\n    - Bezier/B-spline curves and surfaces, plus trimmed surfaces, can be converted into real kernel topology through `make_edge` / `make_face_on_surface` for supported mathematically/topologically valid inputs; supported cases no longer return `UNSUPPORTED_TOPOLOGY_CONSTRUCTION`, while invalid inputs fail deterministically with structured diagnostics.\n    - `List<Geometry>` builtin parameters participate in `geometry_inputs` for both `FeatureGraph` and `TraceFeatureGraph`, and generic-list geometry dependencies drive correct dirty-set / incremental invalidation rather than remaining invisible.\n    - Focused regression fixtures prove the new freeform-to-topology and `List<Geometry>` dependency behavior without weakening existing Stage-4/5 fail-closed semantic-reference, lineage, exactness, or determinism guarantees.\n    - AICAD-132 and later Stage-6 work may rely on these two repaired prerequisite paths only after the AICAD-131 evidence and required tests pass.\n""",
              )

          replace_once(
              final_yaml,
              "  required_tests: [focused Stage-5 compatibility fixtures, existing semantic-reference harness, existing active example suite]",
              "  required_tests: [focused Stage-5 compatibility fixtures, freeform-to-kernel-topology construction and invalid-input diagnostics, List<Geometry> geometry_inputs and dirty-set invalidation fixtures for FeatureGraph and TraceFeatureGraph, existing semantic-reference harness, existing active example suite]",
          )
          replace_once(
              final_yaml,
              "  owner_escalation: [actual Stage-5 behavior contradicts D26-D30 or prevents cross-instance semantic references]",
              "  owner_escalation: [actual Stage-5 behavior contradicts D26-D30 or prevents cross-instance semantic references, either prerequisite fix requires new public semantics beyond approved Stage-5 contracts, either fix cannot be completed without weakening an existing invariant or gate]",
          )

          replace_once(
              tasks_yaml,
              "  required_checks: [focused Stage-5 compatibility fixtures, existing semantic-reference harness, existing active example suite]",
              "  required_checks: [focused Stage-5 compatibility fixtures, freeform-to-kernel-topology construction and invalid-input diagnostics, List<Geometry> geometry_inputs and dirty-set invalidation fixtures for FeatureGraph and TraceFeatureGraph, existing semantic-reference harness, existing active example suite]",
          )
          replace_once(
              tasks_yaml,
              "  escalate_if: [actual Stage-5 behavior contradicts D26-D30 or prevents cross-instance semantic references]",
              "  escalate_if: [actual Stage-5 behavior contradicts D26-D30 or prevents cross-instance semantic references, either prerequisite fix requires new public semantics beyond approved Stage-5 contracts, either fix cannot be completed without weakening an existing invariant or gate]",
          )

          report = "project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md"
          replace_once(report, "### Material limitations carried forward", "### Material limitations entering Stage 6")
          replace_once(
              report,
              "1. Bezier/B-spline curves and surfaces, plus trimmed surfaces, exist as Stage-5 semantic/runtime values but cannot yet become real kernel topology through `make_edge` / `make_face_on_surface`; those paths reject explicitly with `UNSUPPORTED_TOPOLOGY_CONSTRUCTION` rather than silently degrading.",
              "1. Bezier/B-spline curves and surfaces, plus trimmed surfaces, exist as Stage-5 semantic/runtime values but cannot yet become real kernel topology through `make_edge` / `make_face_on_surface`; those paths reject explicitly with `UNSUPPORTED_TOPOLOGY_CONSTRUCTION` rather than silently degrading. **AICAD-131 is required to close this gap before later Stage-6 implementation begins.**",
          )
          replace_once(
              report,
              "2. `List<Geometry>` builtin parameters are currently invisible to `geometry_inputs` in `FeatureGraph` / `TraceFeatureGraph`; dirty-set/incremental invalidation through that generic path is not independently proven. Stage-6 assembly dependencies must therefore be explicit and observable rather than assuming this path.",
              "2. `List<Geometry>` builtin parameters are currently invisible to `geometry_inputs` in `FeatureGraph` / `TraceFeatureGraph`; dirty-set/incremental invalidation through that generic path is not independently proven. **AICAD-131 is required to make this path first-class and prove correct dirty-set/incremental invalidation before later Stage-6 implementation begins.**",
          )
          replace_once(
              report,
              "None of these limitations requires reopening resolved Stage-6 semantic architecture.",
              "Items 1 and 2 are now explicit AICAD-131 remediation requirements and must be closed before AICAD-132/133. The remaining limitations do not require reopening resolved Stage-6 semantic architecture.",
          )
          replace_once(
              report,
              "The provisional `S6-001` task was transition-time evidence reconciliation. That reconciliation is complete here, so promoted **AICAD-131** instead codifies executable compatibility fixtures around the final Stage-5 contracts and known limitations. The remaining 29 tasks preserve their intended capability progression and dependencies, with local `S6-*` identifiers mapped one-to-one to AICAD-132..160.",
              "The provisional `S6-001` task was transition-time evidence reconciliation. That reconciliation is complete here, so promoted **AICAD-131** now combines executable compatibility fixtures with immediate remediation of the two known Stage-5 prerequisite gaps: freeform/trimmed geometry to real kernel topology construction and first-class `List<Geometry>` dependency/invalidation tracking. AICAD-132/133 remain blocked on AICAD-131. The remaining 29 tasks preserve their intended capability progression and dependencies, with local `S6-*` identifiers mapped one-to-one to AICAD-132..160.",
          )
          replace_once(
              report,
              "The Stage-5 limitations listed in Section 2 remain nonblocking. In addition, AICAD remains pre-1.0; direct sketch authoring and several broader product/UI/package-system surfaces remain incomplete or deferred. Stage-6 assemblies/configurations are planned next-stage work, not a current product claim.",
              "The first two Stage-5 limitations listed in Section 2 are blocking prerequisites assigned to AICAD-131 and must be fixed before AICAD-132/133. The remaining listed limitations are nonblocking for Stage-6 entry. In addition, AICAD remains pre-1.0; direct sketch authoring and several broader product/UI/package-system surfaces remain incomplete or deferred. Stage-6 assemblies/configurations are planned next-stage work, not a current product claim.",
          )

          batches = "project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md"
          replace_once(
              batches,
              "The provisional Stage-6 decomposition is preserved. Global IDs are assigned immediately after AICAD-130. The only material task-content adjustment is AICAD-131: transition-time evidence reconciliation is now complete, so the former reconciliation task becomes an executable compatibility-fixture task that locks the Stage-5 contracts Stage 6 relies on.",
              "The provisional Stage-6 decomposition is preserved. Global IDs are assigned immediately after AICAD-130. The material task-content adjustment is AICAD-131: transition-time evidence reconciliation is complete, so the former reconciliation task becomes an executable compatibility-and-remediation task that locks the Stage-5 contracts Stage 6 relies on and closes the two known prerequisite gaps before assembly work begins.",
          )
          replace_once(
              batches,
              "| S6-00 | AICAD-131 | Stage-5 compatibility fixtures and Stage-6 prerequisites | AICAD-131 |",
              "| S6-00 | AICAD-131 | Stage-5 compatibility fixtures; freeform/trimmed topology construction; `List<Geometry>` dependency/invalidation repair | AICAD-131 |",
          )
          replace_once(
              batches,
              "- The generic freeform `List<Geometry>` path is not treated as a proven general B-rep construction path.\n- First-class invalidation through arbitrary generic `List<Geometry>` flows is not assumed; Stage-6 dependencies must be explicit and observable.",
              "- AICAD-131 must close the freeform/trimmed geometry-to-kernel-topology gap for supported `make_edge` / `make_face_on_surface` inputs before later Stage-6 tasks proceed.\n- AICAD-131 must make `List<Geometry>` inputs first-class in `geometry_inputs` and prove correct dirty-set/incremental invalidation in both `FeatureGraph` and `TraceFeatureGraph` before later Stage-6 tasks proceed.",
          )

          handoff = "project/SESSION_HANDOFF.md"
          replace_once(
              handoff,
              "- Bezier/B-spline curves and surfaces, plus trimmed surfaces, cannot yet be converted into real kernel topology through `make_edge` / `make_face_on_surface`; unsupported construction fails explicitly with `UNSUPPORTED_TOPOLOGY_CONSTRUCTION` rather than silently degrading.\n- `List<Geometry>` builtin parameters are currently invisible to `geometry_inputs` in `FeatureGraph` / `TraceFeatureGraph`; do not assume arbitrary generic-list flows provide first-class dirty-set invalidation. Stage-6 assembly dependencies must be explicit and observable.",
              "- Bezier/B-spline curves and surfaces, plus trimmed surfaces, cannot yet be converted into real kernel topology through `make_edge` / `make_face_on_surface`; AICAD-131 must implement supported conversion paths while preserving deterministic structured failure for invalid inputs.\n- `List<Geometry>` builtin parameters are currently invisible to `geometry_inputs` in `FeatureGraph` / `TraceFeatureGraph`; AICAD-131 must make them first-class geometry dependencies and prove dirty-set/incremental invalidation before later Stage-6 tasks rely on them.",
          )

          current = "project/CURRENT_STAGE.md"
          replace_once(
              current,
              "The final Stage-6 queue contains 30 tasks, **AICAD-131 through AICAD-160**, in fixed batches S6-00 through S6-12. Checkpoints are AICAD-141, AICAD-148, and AICAD-156; AICAD-160 is the final Stage-6 owner hard gate.",
              "The final Stage-6 queue contains 30 tasks, **AICAD-131 through AICAD-160**, in fixed batches S6-00 through S6-12. AICAD-131 is the mandatory compatibility-and-remediation prerequisite: it must close the Stage-5 freeform/trimmed-to-kernel-topology construction gap and the `List<Geometry>` dependency/invalidation gap before AICAD-132/133. Checkpoints are AICAD-141, AICAD-148, and AICAD-156; AICAD-160 is the final Stage-6 owner hard gate.",
          )
          PY

          git diff --check
          grep -n "AICAD-131" project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml | head
          grep -n "Bezier/B-spline" project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml | head
          grep -n "List<Geometry>" project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml | head
      - name: Commit planning update and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/aicad131-remediation-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/TASKS.yaml project/CURRENT_STAGE.md project/SESSION_HANDOFF.md project/planning/transitions/stage5-to-stage6/STAGE6_FINAL.yaml project/planning/transitions/stage5-to-stage6/STAGE6_FINAL_BATCHES.md project/planning/transitions/stage5-to-stage6/TRANSITION_REPORT.md .github/workflows/aicad131-remediation-update.yml
          git commit -m "planning: make AICAD-131 close Stage-5 prerequisite gaps"
          git push origin HEAD:claude/aicad-stage6-transition
